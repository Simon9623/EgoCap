[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stera-sdk"
version = "0.0.4"
description = "Trimmed Stera SDK: MCAP loading, Rerun visualization, WiLoR hand-pose export"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24,<2",
    "opencv-python>=4.8",
    "rerun-sdk>=0.22",
    "h5py>=3.8",
    "tqdm>=4.65",
    "mcap>=1.1",
    "mcap-ros2-support>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]
